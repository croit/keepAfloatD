[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

[advisories]
version = 2
# Any RustSec vulnerability, unmaintained, unsound or yanked entry in the active graph fails CI.
yanked = "deny"
unmaintained = "all"
ignore = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
