[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
exceptions = [
    # Full copyright and license text ships in LICENSES/subtle-2.6.1.txt.
    { name = "subtle", version = "=2.6.1", allow = ["BSD-3-Clause"] },
]

[advisories]
version = 2
# Any RustSec vulnerability, unmaintained, unsound or yanked entry in the active graph fails CI.
yanked = "deny"
unmaintained = "all"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # SHA-2 and OpenRaft's random generator use different CPU feature APIs.
    { name = "cpufeatures", version = "=0.2.17" },
    # chrono-tz's build-time PHF generator still uses rand 0.8.
    { name = "rand", version = "=0.8.6" },
    { name = "rand_core", version = "=0.6.4" },
    # OpenRaft macros use syn 3; the remaining derive macros still use syn 2.
    { name = "syn", version = "=2.0.117" },
]
