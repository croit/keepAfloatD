name: Release

on:
  workflow_dispatch:
    inputs:
      publish_ref:
        description: "Branch, tag, or commit SHA to release"
        required: true
        default: "main"
        type: string
      version:
        description: "Release version/tag (leave empty to auto-generate vYYMM.N)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build everything without publishing images or creating a GitHub release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_VERSION: 1.91.1
  # Point the shared CI scripts at the Actions checkout.
  CI_PROJECT_DIR: ${{ github.workspace }}
  GHCR_IMAGE: ghcr.io/croit/keepafloatd

permissions:
  contents: read

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
      prev_tag: ${{ steps.prepare.outputs.prev_tag }}
      dry_run: ${{ steps.prepare.outputs.dry_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PUBLISH_REF: ${{ inputs.publish_ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
            COMMIT="${GITHUB_SHA}"
            DRY_RUN="false"
            git checkout --quiet "${COMMIT}"
          else
            REF="${INPUT_PUBLISH_REF}"
            VERSION_INPUT="${INPUT_VERSION}"
            DRY_RUN="${INPUT_DRY_RUN}"
            git checkout --quiet "${REF}"
            COMMIT="$(git rev-parse HEAD)"

            if [ -n "${VERSION_INPUT}" ]; then
              VERSION="${VERSION_INPUT}"
            else
              PUBLISH_REF="${REF}" ./scripts/ci/publish/version.sh
              # shellcheck disable=SC1091
              . ./version.env
            fi
          fi

          PREV_TAG="$(git tag --merged "${COMMIT}" -l 'v[0-9]*' | grep -E '^v[0-9]{4}\.[0-9]+$' | grep -v "^${VERSION}$" | sort -t. -k1,1 -k2,2n | tail -1 || true)"

          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "prev_tag=${PREV_TAG}"
            echo "dry_run=${DRY_RUN}"
          } >> "${GITHUB_OUTPUT}"

  build-binary:
    name: release binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            musl-tools \
            pkg-config
      - name: Install arm64 cross toolchain
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
      - name: Stamp release version
        run: VERSION="${RELEASE_VERSION}" ./scripts/ci/build/set-version.sh
      # Static musl builds so the artifacts carry no glibc/GLIBC_* dependency and
      # run on any distro, including el9 with glibc 2.34.
      - name: Build release binary
        run: |
          mkdir -p dist
          if [ "${TARGET_ARCH}" = "arm64" ]; then
            TARGET=aarch64-unknown-linux-musl
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          else
            TARGET=x86_64-unknown-linux-musl
          fi
          rustup target add "${TARGET}"
          cargo build --release --locked --target "${TARGET}"
          cp "target/${TARGET}/release/keepafloatd" "dist/keepafloatd-linux-${TARGET_ARCH}"
          chmod +x dist/keepafloatd-linux-*
          if file "dist/keepafloatd-linux-${TARGET_ARCH}" | grep -q "dynamically linked"; then
            echo "ERROR: expected a static musl build" >&2
            file "dist/keepafloatd-linux-${TARGET_ARCH}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-binary-${{ matrix.arch }}
          path: dist/keepafloatd-linux-${{ matrix.arch }}

  build-deb:
    name: release deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            file \
            git \
            liblzma-dev \
            musl-tools \
            pkg-config \
            xz-utils
      - name: Install arm64 cross toolchain
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Stamp release version
        run: VERSION="${RELEASE_VERSION}" ./scripts/ci/build/set-version.sh
      # Static musl build so the .deb's $auto depends carries no libc6 (>= X)
      # constraint and installs on older glibc distributions.
      - name: Build Debian package
        run: |
          mkdir -p dist
          if [ "${TARGET_ARCH}" = "arm64" ]; then
            TARGET=aarch64-unknown-linux-musl
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          else
            TARGET=x86_64-unknown-linux-musl
          fi
          rustup target add "${TARGET}"
          cargo build --release --locked --target "${TARGET}"
          if file "target/${TARGET}/release/keepafloatd" | grep -q "dynamically linked"; then
            echo "ERROR: expected a static musl build" >&2
            exit 1
          fi
          cargo deb --no-build --no-strip --target "${TARGET}"
          find target -type f -name "*_${TARGET_ARCH}.deb" -exec cp {} dist/ \;
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-deb-${{ matrix.arch }}
          path: dist/*_${{ matrix.arch }}.deb

  build-rpm:
    name: release rpm (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            musl-tools \
            pkg-config
      - name: Install arm64 cross toolchain
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Stamp release version
        run: VERSION="${RELEASE_VERSION}" ./scripts/ci/build/set-version.sh
      # Static musl build so the rpm carries no glibc dependency (installs on
      # el9's glibc 2.34 and anything newer).
      - name: Build RPM package
        run: |
          mkdir -p dist
          if [ "${TARGET_ARCH}" = "arm64" ]; then
            TARGET=aarch64-unknown-linux-musl
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          else
            TARGET=x86_64-unknown-linux-musl
          fi
          rustup target add "${TARGET}"
          cargo build --release --locked --target "${TARGET}"
          if file "target/${TARGET}/release/keepafloatd" | grep -q "dynamically linked"; then
            echo "ERROR: expected a static musl build" >&2
            exit 1
          fi
          cargo generate-rpm --target "${TARGET}"
          find target -type f -name '*.rpm' -exec cp {} dist/ \;
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-rpm-${{ matrix.arch }}
          path: dist/*.rpm

  build-source-tarball:
    name: release source tarball
    runs-on: ubuntu-latest
    needs: prepare
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build vendored source tarball
        run: VERSION="${RELEASE_VERSION}" ./scripts/ci/build/source-tarball.sh
      - name: Verify it builds fully offline
        run: ./scripts/ci/test/source-build.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-source
          path: dist/keepafloatd-*.tar.gz

  build-images:
    name: release images
    runs-on: ubuntu-latest
    # Depend on the per-arch binary builds so the runtime image copies those pre-cross-compiled
    # binaries instead of recompiling under QEMU emulation - the old multi-arch in-image compile was
    # the dominant release cost.
    needs: [prepare, build-binary]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Fetch pre-built release binaries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-binary-*
          merge-multiple: true
          path: dist
      - name: Restore binary permissions
        run: chmod 0755 dist/keepafloatd-linux-*
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: needs.prepare.outputs.dry_run != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime-dist
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.dry_run != 'true' }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.commit }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.GHCR_IMAGE }}:sha-${{ needs.prepare.outputs.commit }}
            ${{ env.GHCR_IMAGE }}:latest
  release:
    name: publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-binary
      - build-deb
      - build-rpm
      - build-source-tarball
      - build-images
    if: needs.prepare.outputs.dry_run != 'true'
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      PREVIOUS_TAG: ${{ needs.prepare.outputs.prev_tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-binary-*
          path: release-assets/
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-deb-*
          path: release-assets/
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-rpm-*
          path: release-assets/
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-source
          path: release-assets/
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="release-notes.md"
          if [ -n "${PREVIOUS_TAG}" ]; then
            git log "${PREVIOUS_TAG}..${RELEASE_COMMIT}" \
              --max-count=50 --pretty=format:'* %s (%h)' > "${NOTES_FILE}"
          else
            git log "${RELEASE_COMMIT}" \
              --max-count=50 --pretty=format:'* %s (%h)' > "${NOTES_FILE}"
          fi

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "No new commits." > "${NOTES_FILE}"
          fi

          cat >> "${NOTES_FILE}" <<EOF

          ## Container Images

          Runtime:
          \`\`\`
          docker pull ${GHCR_IMAGE}:${RELEASE_VERSION}
          \`\`\`

          ## Verify downloads

          \`\`\`
          sha256sum --check SHA256SUMS --ignore-missing
          \`\`\`
          EOF
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_VERSION}" \
            release-assets/* \
            --repo "${REPOSITORY}" \
            --target "${RELEASE_COMMIT}" \
            --title "${RELEASE_VERSION}" \
            --notes-file release-notes.md
